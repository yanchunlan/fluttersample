name: test_meta_data
description: A new Flutter package project.
version: 0.0.1
homepage:

environment:
  sdk: ">=2.13.4"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  analyzer: any
  async: ^2.8.0
  build: ^2.0.0
  build_config: '>=0.4.4 <2.0.0'
  collection: ^1.14.0

  json_annotation: '>=4.1.0 <4.9.0'
  meta: ^1.3.0
  path: ^1.8.0
  pub_semver: any
  pubspec_parse: ^1.0.0
  source_gen: ^1.2.2
  source_helper: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


builders:
  testBuilder:
    # 你的注解程序所处文件
    import: "package:test_meta_data/test_meta_data.dart"
    # 注解程序对应的构造方法
    builder_factories: ["TestMetadata"]
    # 生成的新文件后缀
    build_extensions: {".dart": [".g.part"]}
    auto_apply: root_package
    build_to: source


